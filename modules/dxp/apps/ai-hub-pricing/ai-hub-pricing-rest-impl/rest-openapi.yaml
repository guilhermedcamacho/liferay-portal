components:
    schemas:
        QuotaBlock:
            properties:
                aiHubQuotaConversionTableVersion:
                    format: double
                    readOnly: true
                    type: number
                externalReferenceCode:
                    readOnly: true
                    type: string
                id:
                    format: int64
                    readOnly: true
                    type: integer
                purchaseDate:
                    format: date-time
                    readOnly: true
                    type: string
                purchaseExpirationDate:
                    format: date-time
                    readOnly: true
                    type: string
                remainingBalance:
                    format: int32
                    readOnly: true
                    type: integer
                size:
                    format: int32
                    type: integer
                transactionId:
                    type: string
            required:
                -   size
                -   transactionId
            type: object
info:
    description:
        "A Java client JAR is available for use with the group ID 'com.liferay', artifact ID
        'com.liferay.ai.hub.pricing.rest.client', and version '1.0.0'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: ""
    version: v1.0
openapi: 3.0.1
paths:
    "/accounts/{accountId}/quota-blocks/purchase":
        post:
            operationId: postAccountQuotaBlockPurchase
            parameters:
                -   in: path
                    name: accountId
                    required: true
                    schema:
                        format: int64
                        type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/QuotaBlock"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/QuotaBlock"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/QuotaBlock"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/QuotaBlock"
            tags: ["QuotaBlock"]